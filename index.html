<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INDOSAKU - Checkout & Pembayaran</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [v-cloak] { display: none; }
        .va-option input[type="radio"]:checked + label {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased flex flex-col min-h-screen">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 bg-white shadow-sm border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <!-- Logo Baru -->
                <img src="https://i.ibb.co/pLp1yD4/logo-indosaku-baru.png" alt="INDOSAKU Logo" class="h-10 w-auto">
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-gray-900 leading-none">INDOSAKU</h1>
                    <span class="text-xs text-brand-600 font-medium">Checkout & Pembayaran</span>
                </div>
            </div>
            <a href="index.html" class="text-sm text-gray-600 hover:text-brand-600 flex items-center space-x-1">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Kembali ke Toko</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- Formulir Checkout & Pilihan Pembayaran -->
            <div class="md:col-span-2 space-y-8">
                <section class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                    <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center space-x-2">
                        <i class="fa-solid fa-user text-brand-600"></i>
                        <span>Informasi Pelanggan</span>
                    </h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                            <input type="text" id="name" placeholder="Masukkan nama lengkap" class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-gray-900">
                        </div>
                        <div>
                            <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Nomor WhatsApp</label>
                            <input type="tel" id="phone" placeholder="Contoh: 081234567890" class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-gray-900">
                        </div>
                        <div class="sm:col-span-2">
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                            <input type="email" id="email" placeholder="Masukkan alamat email" class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-gray-900">
                        </div>
                    </div>
                </section>

                <section class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                    <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center space-x-2">
                        <i class="fa-solid fa-credit-card text-brand-600"></i>
                        <span>Pilih Metode Pembayaran</span>
                    </h2>
                    
                    <div class="space-y-4">
                        <!-- Pilihan QRIS -->
                        <div class="va-option">
                            <input type="radio" id="qris" name="payment_method" value="qris" class="hidden" checked>
                            <label for="qris" class="block p-4 bg-white border border-gray-200 rounded-xl cursor-pointer hover:border-brand-300 transition">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-3">
                                        <img src="https://ipaymu.com/wp-content/uploads/2021/08/qris-logo.png" alt="QRIS" class="h-8 w-auto">
                                        <span class="font-semibold text-gray-900">QRIS</span>
                                    </div>
                                    <span class="text-xs text-gray-500">Otomatis Terverifikasi</span>
                                </div>
                            </label>
                        </div>

                        <!-- Pilihan Virtual Account (VA) -->
                        <div>
                            <h3 class="text-sm font-semibold text-gray-700 mb-2">Virtual Account (Transfer Bank)</h3>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                <!-- VA Mandiri -->
                                <div class="va-option">
                                    <input type="radio" id="va_mandiri" name="payment_method" value="va_mandiri" class="hidden">
                                    <label for="va_mandiri" class="block p-3 bg-white border border-gray-200 rounded-xl cursor-pointer hover:border-brand-300 transition text-center space-y-1">
                                        <img src="https://ipaymu.com/wp-content/uploads/2021/08/mandiri-logo.png" alt="Mandiri" class="h-6 w-auto mx-auto">
                                        <span class="block text-xs font-medium text-gray-900">Mandiri VA</span>
                                    </label>
                                </div>
                                <!-- VA BNI -->
                                <div class="va-option">
                                    <input type="radio" id="va_bni" name="payment_method" value="va_bni" class="hidden">
                                    <label for="va_bni" class="block p-3 bg-white border border-gray-200 rounded-xl cursor-pointer hover:border-brand-300 transition text-center space-y-1">
                                        <img src="https://ipaymu.com/wp-content/uploads/2021/08/bni-logo.png" alt="BNI" class="h-6 w-auto mx-auto">
                                        <span class="block text-xs font-medium text-gray-900">BNI VA</span>
                                    </label>
                                </div>
                                <!-- VA BRI -->
                                <div class="va-option">
                                    <input type="radio" id="va_bri" name="payment_method" value="va_bri" class="hidden">
                                    <label for="va_bri" class="block p-3 bg-white border border-gray-200 rounded-xl cursor-pointer hover:border-brand-300 transition text-center space-y-1">
                                        <img src="https://ipaymu.com/wp-content/uploads/2021/08/bri-logo.png" alt="BRI" class="h-6 w-auto mx-auto">
                                        <span class="block text-xs font-medium text-gray-900">BRI VA</span>
                                    </label>
                                </div>
                                <!-- VA CIMB Niaga -->
                                <div class="va-option">
                                    <input type="radio" id="va_cimb" name="payment_method" value="va_cimb" class="hidden">
                                    <label for="va_cimb" class="block p-3 bg-white border border-gray-200 rounded-xl cursor-pointer hover:border-brand-300 transition text-center space-y-1">
                                        <img src="https://ipaymu.com/wp-content/uploads/2021/08/cimb-logo.png" alt="CIMB Niaga" class="h-6 w-auto mx-auto">
                                        <span class="block text-xs font-medium text-gray-900">CIMB VA</span>
                                    </label>
                                </div>
                                <!-- VA Permata -->
                                <div class="va-option">
                                    <input type="radio" id="va_permata" name="payment_method" value="va_permata" class="hidden">
                                    <label for="va_permata" class="block p-3 bg-white border border-gray-200 rounded-xl cursor-pointer hover:border-brand-300 transition text-center space-y-1">
                                        <img src="https://ipaymu.com/wp-content/uploads/2021/08/permata-logo.png" alt="Permata" class="h-6 w-auto mx-auto">
                                        <span class="block text-xs font-medium text-gray-900">Permata VA</span>
                                    </label>
                                </div>
                                <!-- VA Artha Graha -->
                                <div class="va-option">
                                    <input type="radio" id="va_ag" name="payment_method" value="va_ag" class="hidden">
                                    <label for="va_ag" class="block p-3 bg-white border border-gray-200 rounded-xl cursor-pointer hover:border-brand-300 transition text-center space-y-1">
                                        <img src="https://ipaymu.com/wp-content/uploads/2021/08/ag-logo.png" alt="Artha Graha" class="h-6 w-auto mx-auto">
                                        <span class="block text-xs font-medium text-gray-900">Artha Graha VA</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Pilihan Convenience Store -->
                        <div>
                            <h3 class="text-sm font-semibold text-gray-700 mb-2">Gerai Ritel</h3>
                            <div class="grid grid-cols-2 gap-3">
                                <!-- Alfamart -->
                                <div class="va-option">
                                    <input type="radio" id="alfamart" name="payment_method" value="alfamart" class="hidden">
                                    <label for="alfamart" class="block p-3 bg-white border border-gray-200 rounded-xl cursor-pointer hover:border-brand-300 transition text-center space-y-1">
                                        <img src="https://ipaymu.com/wp-content/uploads/2021/08/alfamart-logo.png" alt="Alfamart" class="h-6 w-auto mx-auto">
                                        <span class="block text-xs font-medium text-gray-900">Alfamart</span>
                                    </label>
                                </div>
                                <!-- Indomaret -->
                                <div class="va-option">
                                    <input type="radio" id="indomaret" name="payment_method" value="indomaret" class="hidden">
                                    <label for="indomaret" class="block p-3 bg-white border border-gray-200 rounded-xl cursor-pointer hover:border-brand-300 transition text-center space-y-1">
                                        <img src="https://ipaymu.com/wp-content/uploads/2021/08/indomaret-logo.png" alt="Indomaret" class="h-6 w-auto mx-auto">
                                        <span class="block text-xs font-medium text-gray-900">Indomaret</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Ringkasan Pesanan -->
            <div class="space-y-6">
                <section class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 sticky top-24">
                    <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center space-x-2">
                        <i class="fa-solid fa-shopping-bag text-brand-600"></i>
                        <span>Ringkasan Pesanan</span>
                    </h2>
                    
                    <div id="order_items" class="space-y-3 mb-4 border-b border-gray-100 pb-4">
                        <!-- Dinamis via JS -->
                    </div>

                    <div class="space-y-2 mb-6">
                        <div class="flex justify-between text-sm text-gray-600">
                            <span>Subtotal</span>
                            <span id="subtotal">Rp 0</span>
                        </div>
                        <div class="flex justify-between text-sm text-gray-600">
                            <span>Biaya Layanan</span>
                            <span>Rp 0</span>
                        </div>
                        <div class="flex justify-between text-base font-bold text-gray-900 pt-2 border-t border-gray-100">
                            <span>Total Pembayaran</span>
                            <span id="total_price" class="text-brand-600">Rp 0</span>
                        </div>
                    </div>

                    <button onclick="processPayment()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 rounded-xl transition shadow-md flex items-center justify-center space-x-2">
                        <span>Bayar Sekarang</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    <p class="text-center text-xs text-gray-500 mt-4">
                        <i class="fa-solid fa-lock text-green-500"></i>
                        Pembayaran Aman & Terenkripsi oleh iPaymu
                    </p>
                </section>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-100 mt-12 py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-gray-500">
            &copy; 2024 INDOSAKU. Semua Hak Dilindungi.
        </div>
    </footer>

    <!-- JavaScript Aplikasi -->
    <script>
        // Konfigurasi iPaymu Sandbox
        const iPaymuApiKey = '79E1AB84-2CD2-4409-A6B4-31AA8686E8F1'; // Ganti dengan API Key Sandbox Anda
        const iPaymuVa = '1179008131611563'; // Ganti dengan Nomor VA Sandbox Anda
        const ipaymuBaseUrl = 'https://sandbox.ipaymu.com/api/v2';

        // Data Keranjang Simulasi
        const cartItems = [
            { id: 1, name: 'Pulsa Telkomsel Rp 50.000', price: 51500, qty: 1 },
            { id: 2, name: 'Softcase Silikon Bening', price: 15000, qty: 2 }
        ];

        // Inisialisasi Tampilan
        window.onload = function() {
            renderOrderItems();
        };

        // Render Item Pesanan
        function renderOrderItems() {
            const container = document.getElementById('order_items');
            let subtotal = 0;

            if (cartItems.length === 0) {
                container.innerHTML = '<p class="text-center text-sm text-gray-500">Keranjang kosong.</p>';
                return;
            }

            container.innerHTML = cartItems.map(item => {
                const itemTotal = item.price * item.qty;
                subtotal += itemTotal;
                return `
                    <div class="flex items-center justify-between text-sm">
                        <div class="flex-1 pr-4">
                            <p class="font-medium text-gray-900">${item.name}</p>
                            <p class="text-xs text-gray-500">${item.qty} x ${formatRupiah(item.price)}</p>
                        </div>
                        <p class="font-semibold text-gray-900">${formatRupiah(itemTotal)}</p>
                    </div>
                `;
            }).join('');

            document.getElementById('subtotal').innerText = formatRupiah(subtotal);
            document.getElementById('total_price').innerText = formatRupiah(subtotal); // Sementara biaya layanan 0
        }

        // Proses Pembayaran dengan iPaymu API
        async function processPayment() {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const paymentMethod = document.querySelector('input[name="payment_method"]:checked').value;

            if (!name || !phone || !email) {
                alert('Mohon lengkapi informasi pelanggan.');
                return;
            }

            const totalAmount = cartItems.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const productNames = cartItems.map(i => i.name).join(', ');

            try {
                // Request pembayaran ke iPaymu Sandbox via Proxy (karena CORS)
                // Catatan: Di lingkungan produksi, panggilan API ini harus dilakukan dari sisi server Anda.
                // Untuk keperluan simulasi di sandbox, kita akan menggunakan layanan cors-anywhere sebagai proxy.
                const proxyUrl = 'https://cors-anywhere.herokuapp.com/'; 
                const apiUrl = `${ipaymuBaseUrl}/payment`;

                const response = await fetch(proxyUrl + apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'va': iPaymuVa,
                        'apiKey': iPaymuApiKey
                    },
                    body: JSON.stringify({
                        product: [productNames],
                        qty: ["1"],
                        price: [totalAmount.toString()],
                        returnUrl: window.location.href, // Ganti dengan URL sukses Anda
                        cancelUrl: window.location.href, // Ganti dengan URL batal Anda
                        notifyUrl: window.location.href, // Ganti dengan URL notify server Anda
                        buyerName: name,
                        buyerEmail: email,
                        buyerPhone: phone,
                        paymentMethod: paymentMethod
                    })
                });

                const result = await response.json();

                if (result.Status === 200) {
                    // Redirect ke halaman pembayaran iPaymu
                    window.location.href = result.Data.Url;
                } else {
                    alert('Gagal memproses pembayaran: ' + result.Message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Terjadi kesalahan saat menghubungi iPaymu.');
            }
        }

        // Helper: Format Rupiah
        function formatRupiah(amount) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount);
        }
    </script>
</body>
</html>
